name: External Renderer consumer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  external-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Cargo.toml
            /Cargo.lock
            /src/
            /tests/
            /tools/renderer-consumer/
            /baseline/static-usd-macos-axis-angle/acos-diagnostic.json
            /baseline/static-usd-macos-axis-angle/fixtures.json
            /baseline/static-usd-rotation-diagnostic/0e50-memory-inputs.json
            /baseline/static-usd-rotation-diagnostic/darwin-atan2/reference.json
            /baseline/static-usd-string-escaping/reference.json
            /baseline/static-usd/rock/create.json
            /baseline/reference/blender-5.2.3/random-falloff/first-distribution.bin
            /baseline/reference/blender-5.2.3/random-falloff/first-sequence.bin
            /baseline/static-usd-macos-axis-angle/all-world-fixtures.json.gz
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Check core without preview
        run: cargo check --locked --no-default-features --lib
      - name: Check external consumer formatting
        run: cargo fmt --manifest-path tools/renderer-consumer/Cargo.toml --check
      - name: Compile public API from a separate crate
        run: cargo clippy --locked --manifest-path tools/renderer-consumer/Cargo.toml --all-targets -- -D warnings
      - name: Check layer order and timestamp conversion without GPU
        run: |
          cargo test --locked --features preview --lib geometry::cache::tests
          cargo test --locked --features preview --lib preview::render::tests
          cargo test --locked --features preview --lib preview::buffers::tests
      - name: Install Linux software Vulkan and virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 xvfb xauth
      - name: Build the executable consumer
        if: runner.os == 'Linux'
        run: cargo build --locked --manifest-path tools/renderer-consumer/Cargo.toml
      - name: Exercise offscreen renderer and host-owned window
        if: runner.os == 'Linux'
        shell: bash
        env:
          WINIT_UNIX_BACKEND: x11
        run: |
          set -euo pipefail
          mkdir -p target/renderer-evidence
          timeout 120s tools/renderer-consumer/target/debug/formora-renderer-consumer --offscreen target/renderer-evidence/offscreen 2>&1 | tee target/renderer-evidence/offscreen.log
          timeout 120s xvfb-run -a tools/renderer-consumer/target/debug/formora-renderer-consumer --window target/renderer-evidence/window 2>&1 | tee target/renderer-evidence/window.log
      - name: Retain PNGs and adapter logs
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: renderer-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/renderer-evidence
          if-no-files-found: error
