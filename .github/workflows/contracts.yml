name: Contract checks (not product acceptance)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features
      - name: Check source metadata (product tests remain unrun)
        run: cargo run --locked -- baseline check --root .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-mcp.txt
      - name: Test reference comparison failure detection
        run: python -m unittest discover -s tools/tests -v
      - name: Round-trip polygon reference payloads (not primitive generation)
        run: python tools/polygon_reference_smoke.py target/debug/formora target/polygon-reference-smoke
      - name: Verify recorded selection references (not product selection)
        run: python tools/compare_selection_reference.py --suite baseline/fixtures/mesh-selection.json --reference baseline/reference/blender-5.2.3/mesh-selection --repeat baseline/reference/blender-5.2.3/mesh-selection-repeat --output target/selection-reference-reproduction.json
      - name: Verify recorded transform references (not product transforms)
        run: python tools/compare_transform_reference.py baseline/fixtures/mesh-transform.json baseline/reference/blender-5.2.3/mesh-transform baseline/reference/blender-5.2.3/mesh-transform-repeat target/transform-reference-reproduction.json
      - name: Verify recorded direct-snap references (not product snapping)
        run: python tools/compare_snap_menu_reference.py --suite baseline/fixtures/snap-menu.json --reference baseline/reference/blender-5.2.3/snap-menu --repeat baseline/reference/blender-5.2.3/snap-menu-repeat --output target/snap-menu-reference-reproduction.json
      - name: Verify raw snap rotation modes and channel locks (not product acceptance)
        run: python tools/compare_snap_rotation_reference.py --suite baseline/fixtures/snap-rotation.json --reference baseline/reference/blender-5.2.3/snap-rotation --repeat baseline/reference/blender-5.2.3/snap-rotation-repeat --output target/snap-rotation-reference-reproduction.json
      - name: Verify nonidentity delta snap source captures (not product acceptance)
        run: python tools/compare_snap_delta_reference.py --suite baseline/fixtures/snap-delta.json --first baseline/reference/blender-5.2.3/snap-delta --second baseline/reference/blender-5.2.3/snap-delta-repeat --receipts docs/evidence/snap-delta-baseline/native-processes.json --output target/snap-delta-reference-reproduction.json
      - name: Verify vertex merge source captures (not product acceptance)
        run: python tools/compare_mesh_merge_reference.py --suite baseline/fixtures/mesh-merge.json --first docs/evidence/mesh-merge-baseline/native-01 --second docs/evidence/mesh-merge-baseline/native-02 --receipts docs/evidence/mesh-merge-baseline/native-processes.json --output target/mesh-merge-reference-reproduction.json
      - name: Verify stdio with the official MCP client
        run: python tools/mcp_smoke.py target/debug/formora
      - name: Compare automatic normal queries through CLI and official MCP
        run: python tools/normal_runtime_smoke.py target/debug/formora target/normal-runtime-cases
      - name: Generate primitives and compare fixed geometry through CLI and MCP
        run: python tools/primitive_reference_smoke.py target/debug/formora target/generated-primitive-cases
      - name: Verify negative and zero-axis scale geometry through CLI and MCP
        run: python tools/remaining_scale_regression.py target/debug/formora target/remaining-scale-cases
      - name: Execute selection cases through CLI and official MCP
        run: python tools/selection_runtime_smoke.py target/debug/formora target/selection-runtime-cases
      - name: Execute primitive creation contexts through CLI and official MCP
        run: python tools/creation_context_runtime.py target/debug/formora target/creation-context-cases
      - name: Execute every required transform case through CLI and official MCP
        run: python tools/transform_runtime_smoke.py target/debug/formora target/transform-runtime-cases
      - name: Execute all supported single edit-mesh snaps through CLI and official MCP
        run: python tools/snap_runtime_smoke.py target/debug/formora target/snap-runtime-cases
      - name: Execute object and multi-edit snaps through CLI and official MCP
        run: python tools/scene_snap_runtime_smoke.py target/debug/formora target/scene-snap-runtime-cases
      - name: Execute every raw rotation snap through CLI and official MCP
        run: python tools/rotation_snap_runtime.py target/debug/formora target/rotation-snap-runtime-cases --gzip-output
      - name: Execute every nonidentity delta snap through CLI and official MCP
        run: python tools/delta_snap_runtime.py target/debug/formora target/delta-snap-runtime-cases --gzip-output
      - name: Verify generation without source repository access
        if: runner.os == 'macOS'
        run: python tools/primitive_independent.py target/debug/formora target/independent-primitive-generation
      - name: Verify creation and insertion without source repository access
        if: runner.os == 'macOS'
        run: python tools/creation_context_independent.py target/debug/formora target/independent-creation-contexts
