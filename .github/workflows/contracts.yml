name: Contract checks (not product acceptance)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features
      - name: Check the external material consumer (no GPU execution)
        run: |
          cargo fmt --manifest-path consumers/material-headless/Cargo.toml --check
          cargo clippy --locked --manifest-path consumers/material-headless/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path consumers/material-headless/Cargo.toml --all-targets --features gpu -- -D warnings
      - name: Check source metadata (product tests remain unrun)
        run: cargo run --locked -- baseline check --root .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reference comparison failure detection
        run: python -m unittest discover -s tools/tests -v
      - run: python -m pip install -r tools/requirements-mcp.txt
      - name: Verify stdio with the official MCP client
        run: python tools/mcp_smoke.py target/debug/formora
