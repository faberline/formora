[package]
name = "formora"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Agent-operated 3D creation and runtime"

[features]
default = []
render = ["dep:bytemuck", "dep:wgpu"]
preview = ["render", "dep:arboard", "dep:glam", "dep:pollster", "dep:winit"]

[dependencies]
formora_native_bb025 = { package = "formora-native-bb025", path = "compat/bb025", default-features = false }
fs2 = "0.4"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
bytemuck = { version = "1", features = ["derive"], optional = true }
arboard = { version = "3.6", default-features = false, optional = true }
glam = { version = "0.34", optional = true }
png = "0.18"
pollster = { version = "0.4", optional = true }
wgpu = { version = "26.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"], optional = true }
winit = { version = "0.30.12", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dev-dependencies]
naga = { version = "26.0.0", features = ["wgsl-in"] }

[workspace]
exclude = ["compat/bb025", "consumers/material-headless"]
