[package]
name = "formora"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Agent-operated 3D creation and runtime"

[dependencies]
fs2 = "0.4"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
